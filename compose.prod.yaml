# Production overrides: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Single VPS, Caddy terminates TLS automatically for SERVER_NAME.
services:
  php:
    build:
      context: .
      target: prod
    image: tarcza-backend:prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      SERVER_NAME: ${SERVER_NAME}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: cors_origins https://${SERVER_NAME}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: '^https?://.*$$'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - jwt_keys:/app/config/jwt

  worker:
    image: tarcza-backend:prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
    volumes:
      - jwt_keys:/app/config/jwt

  database:
    ports: !reset []

volumes:
  jwt_keys:
