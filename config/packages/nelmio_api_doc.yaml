nelmio_api_doc:
    documentation:
        info:
            title: Tarcza Polska API
            description: |
                Backend for the Tarcza Polska civil resilience platform.

                * `/api/v1/*` - Citizen mobile app (Flutter). Authenticate with the JWT returned by `POST /api/v1/devices`.
                * `/api/command/*` - Command Center. Authenticate with the JWT returned by `POST /api/command/login`.

                All spatial payloads are GeoJSON (WGS84, `[lng, lat]` order). Every error is an `ErrorResponse`.
                `GET /map`, `GET /verifications/pending` and `GET /alerts` send an `ETag`; repeat the value in
                `If-None-Match` to get `304 Not Modified`.
            version: 1.1.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                # ---- errors -------------------------------------------------------------------
                ErrorViolation:
                    type: object
                    required: [field, message]
                    properties:
                        field: { type: string, description: 'Name of the body field (maps 1:1 onto the form field)' }
                        message: { type: string }
                ErrorDetail:
                    type: object
                    required: [code, message]
                    properties:
                        code:
                            type: string
                            description: >
                                Stable machine-readable code: bad_request, unauthorized, token_expired, forbidden, not_found,
                                conflict, gone, verification_already_answered, verification_expired, validation_failed,
                                too_many_requests, internal_error.
                        message: { type: string }
                        retryAfter: { type: integer, description: 'Seconds until the next attempt may succeed (429 only, also sent as the Retry-After header)' }
                        violations:
                            type: array
                            items: { $ref: '#/components/schemas/ErrorViolation' }
                ErrorResponse:
                    type: object
                    required: [error]
                    properties:
                        error: { $ref: '#/components/schemas/ErrorDetail' }

                # ---- shared -------------------------------------------------------------------
                GeoJsonGeometry:
                    type: object
                    description: 'GeoJSON geometry in WGS84, coordinates ordered [lng, lat].'
                    required: [type, coordinates]
                    properties:
                        type: { type: string, enum: [Point, Polygon, MultiPolygon] }
                        coordinates:
                            type: array
                            items: { }
                            description: 'Point: [lng, lat]; Polygon: [[[lng, lat], ...]]; MultiPolygon: [[[[lng, lat], ...]]]'
                IncidentStatus: { type: string, enum: [detected, verifying, active, resolved] }
                ReportScope: { type: string, enum: [area, point], description: 'area = polygon of cells; point = one object (fuel station / shelter)' }
                PoiKind: { type: string, enum: [fuel_station, shelter] }
                FuelType: { type: string, enum: [pb95, pb98, diesel, lpg] }
                FuelAvailability: { type: string, enum: [unknown, available, unavailable] }
                ShelterAvailability: { type: string, enum: [unknown, always, on_demand, scheduled], description: 'Opening regime from the national register' }
                PoiRef:
                    type: object
                    description: The object a point-scoped report / incident / question is about.
                    required: [kind, id, name]
                    properties:
                        kind: { $ref: '#/components/schemas/PoiKind' }
                        id: { type: string, format: uuid }
                        name: { type: string }
                        location: { $ref: '#/components/schemas/GeoJsonGeometry' }
                ConfidenceLevel: { type: string, enum: [unverified, likely, high, confirmed] }
                AlertSeverity: { type: string, enum: [info, warning, danger] }
                ShelterOccupancy: { type: string, enum: [unknown, plenty, limited, full], description: 'Room left in an open shelter' }

                # ---- devices ------------------------------------------------------------------
                DeviceRegistered:
                    type: object
                    required: [deviceId, token]
                    properties:
                        deviceId: { type: string, format: uuid }
                        token: { type: string, description: 'Bearer token for /api/v1/* (valid 30 days)' }
                DevicePreferences:
                    type: object
                    required: [locationRefresh]
                    properties:
                        locationRefresh: { type: boolean, description: 'Receive the location_refresh reminder push (default true)' }
                DeviceProfile:
                    type: object
                    required: [deviceId, hasPushToken, preferences]
                    properties:
                        deviceId: { type: string, format: uuid }
                        platform: { type: string, nullable: true, description: 'ios | android | web | simulator' }
                        hasPushToken: { type: boolean }
                        lastLocation:
                            nullable: true
                            allOf: [{ $ref: '#/components/schemas/GeoJsonGeometry' }]
                            description: Point or null until the first location update
                        h3Cell: { type: string, nullable: true }
                        locationUpdatedAt: { type: string, format: date-time, nullable: true }
                        locationSource:
                            nullable: true
                            allOf: [{ $ref: '#/components/schemas/LocationSource' }]
                        preferences: { $ref: '#/components/schemas/DevicePreferences' }
                LocationUpdated:
                    type: object
                    required: [h3Cell]
                    properties:
                        h3Cell: { type: string, description: 'H3 cell (resolution 9) of the stored position' }

                # ---- incidents ----------------------------------------------------------------
                Community:
                    type: object
                    required: [reports, answers]
                    properties:
                        reports: { type: integer }
                        answers: { type: integer }
                        agreementPct: { type: integer, nullable: true, description: 'Share of answers confirming the problem; null until somebody answered' }
                IncidentSummary:
                    type: object
                    description: Public incident fields shared by IncidentView and the map feature properties.
                    required: [id, type, typeLabel, status, statusLabel, confidenceLevel, confidenceLabel, confidenceScore, startedAt, lastActivityAt, community, scope, poi, fuelTypes]
                    properties:
                        id: { type: string, format: uuid }
                        type: { $ref: '#/components/schemas/ReportType' }
                        typeLabel: { type: string }
                        status: { $ref: '#/components/schemas/IncidentStatus' }
                        statusLabel: { type: string }
                        confidenceLevel: { $ref: '#/components/schemas/ConfidenceLevel' }
                        confidenceLabel: { type: string }
                        confidenceScore: { type: number, format: float, minimum: 0, maximum: 1 }
                        startedAt: { type: string, format: date-time }
                        lastActivityAt: { type: string, format: date-time }
                        lastConfirmedAt: { type: string, format: date-time, nullable: true }
                        community: { $ref: '#/components/schemas/Community' }
                        summary: { type: string, nullable: true, description: 'AI research summary, when available' }
                        scope: { $ref: '#/components/schemas/ReportScope' }
                        poi: { nullable: true, allOf: [{ $ref: '#/components/schemas/PoiRef' }], description: 'scope=point: the station / shelter this incident is about' }
                        fuelTypes: { type: array, items: { $ref: '#/components/schemas/FuelType' }, description: 'Fuel types reported missing (fuel_shortage)' }
                IncidentView:
                    allOf:
                        - { $ref: '#/components/schemas/IncidentSummary' }
                        - type: object
                          required: [area]
                          properties:
                              area:
                                  nullable: true
                                  allOf: [{ $ref: '#/components/schemas/GeoJsonGeometry' }]
                                  description: Polygon / MultiPolygon of verified cells; null while the incident is only detected
                IncidentTimelineEntry:
                    type: object
                    description: One entry of the public incident history. `details` holds small, type-specific facts (counts, levels), never positions.
                    required: [type, label, at, details]
                    properties:
                        type:
                            type: string
                            enum: [created, wave_started, wave_closed, area_changed, confidence_changed, research_completed, source_added, alert_published, photo_attached, resolved]
                        label: { type: string, description: 'Polish, ready to display' }
                        at: { type: string, format: date-time }
                        details:
                            type: object
                            additionalProperties: { nullable: true, oneOf: [{ type: string }, { type: number }, { type: integer }, { type: boolean }] }
                            description: 'e.g. {reports} for created, {ring, cells, devices} for wave_started, {positiveCells, negativeCells, unknownCells, yes, no} for area_changed, {from, to, score} for confidence_changed'
                IncidentFeatureProperties:
                    allOf:
                        - { $ref: '#/components/schemas/IncidentSummary' }
                        - type: object
                          required: [kind]
                          properties:
                              kind: { type: string, enum: [incident] }

                # ---- fuel stations ------------------------------------------------------------
                FuelStationFuel:
                    type: object
                    required: [type, label, status, statusLabel]
                    properties:
                        type: { $ref: '#/components/schemas/FuelType' }
                        label: { type: string }
                        status: { $ref: '#/components/schemas/FuelAvailability' }
                        statusLabel: { type: string }
                        confirmedAt: { type: string, format: date-time, nullable: true }
                FuelStationSummary:
                    type: object
                    required: [id, name, fuels, shortage, missingFuelTypes, confirmationCount]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        brand: { type: string, nullable: true }
                        address: { type: string, nullable: true }
                        fuels: { type: array, items: { $ref: '#/components/schemas/FuelStationFuel' }, description: 'Fuel types sold (or ever reported) at this station with current availability' }
                        shortage: { type: boolean, description: 'At least one fuel type currently reported missing' }
                        missingFuelTypes: { type: array, items: { $ref: '#/components/schemas/FuelType' } }
                        lastConfirmedAt: { type: string, format: date-time, nullable: true }
                        confirmationCount: { type: integer }
                        distanceMeters: { type: integer, description: 'Only in GET /fuel-stations?lat&lng and the offline bundle' }
                FuelStationView:
                    allOf:
                        - { $ref: '#/components/schemas/FuelStationSummary' }
                        - type: object
                          required: [location]
                          properties:
                              location: { $ref: '#/components/schemas/GeoJsonGeometry' }
                FuelStationFeatureProperties:
                    allOf:
                        - { $ref: '#/components/schemas/FuelStationSummary' }
                        - type: object
                          required: [kind]
                          properties:
                              kind: { type: string, enum: [fuel_station] }

                # ---- shelters -----------------------------------------------------------------
                ShelterSummary:
                    type: object
                    required: [id, name, status, statusLabel, occupancy, occupancyLabel, confirmationCount]
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        address: { type: string, nullable: true }
                        capacity: { type: integer, nullable: true }
                        status: { $ref: '#/components/schemas/ShelterStatus' }
                        statusLabel: { type: string }
                        occupancy: { $ref: '#/components/schemas/ShelterOccupancy' }
                        occupancyLabel: { type: string }
                        availability: { $ref: '#/components/schemas/ShelterAvailability' }
                        availabilityLabel: { type: string }
                        lastConfirmedAt: { type: string, format: date-time, nullable: true }
                        confirmationCount: { type: integer }
                        distanceMeters: { type: integer, description: 'Only in GET /shelters?lat&lng' }
                ShelterView:
                    allOf:
                        - { $ref: '#/components/schemas/ShelterSummary' }
                        - type: object
                          required: [location]
                          properties:
                              location: { $ref: '#/components/schemas/GeoJsonGeometry' }
                ShelterFeatureProperties:
                    allOf:
                        - { $ref: '#/components/schemas/ShelterSummary' }
                        - type: object
                          required: [kind]
                          properties:
                              kind: { type: string, enum: [shelter] }

                # ---- alerts -------------------------------------------------------------------
                AlertSummary:
                    type: object
                    required: [id, title, body, severity, createdAt, expiresAt, active]
                    properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        body: { type: string }
                        severity: { $ref: '#/components/schemas/AlertSeverity' }
                        incidentId: { type: string, format: uuid, nullable: true }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        active: { type: boolean }
                AlertView:
                    allOf:
                        - { $ref: '#/components/schemas/AlertSummary' }
                        - type: object
                          properties:
                              area:
                                  allOf: [{ $ref: '#/components/schemas/GeoJsonGeometry' }]
                                  description: Only in GET /alerts/{id}
                AlertFeatureProperties:
                    allOf:
                        - { $ref: '#/components/schemas/AlertSummary' }
                        - type: object
                          required: [kind]
                          properties:
                              kind: { type: string, enum: [alert] }

                # ---- map ----------------------------------------------------------------------
                MapFeature:
                    type: object
                    required: [type, id, geometry, properties]
                    properties:
                        type: { type: string, enum: [Feature] }
                        id: { type: string, format: uuid, description: 'Same value as properties.id' }
                        geometry:
                            allOf: [{ $ref: '#/components/schemas/GeoJsonGeometry' }]
                            description: 'incident (scope=area): polygon, centroid Point while the area is empty; incident (scope=point): Point at the object; shelter / fuel_station: Point; alert: polygon'
                        properties:
                            oneOf:
                                - { $ref: '#/components/schemas/IncidentFeatureProperties' }
                                - { $ref: '#/components/schemas/ShelterFeatureProperties' }
                                - { $ref: '#/components/schemas/FuelStationFeatureProperties' }
                                - { $ref: '#/components/schemas/AlertFeatureProperties' }
                            discriminator:
                                propertyName: kind
                                mapping:
                                    incident: '#/components/schemas/IncidentFeatureProperties'
                                    shelter: '#/components/schemas/ShelterFeatureProperties'
                                    fuel_station: '#/components/schemas/FuelStationFeatureProperties'
                                    alert: '#/components/schemas/AlertFeatureProperties'
                MapFeatureCollection:
                    type: object
                    required: [type, features]
                    properties:
                        type: { type: string, enum: [FeatureCollection] }
                        features:
                            type: array
                            items: { $ref: '#/components/schemas/MapFeature' }

                # ---- reports ------------------------------------------------------------------
                ReportTypeOption:
                    type: object
                    required: [value, label, scope, poiKind, fuelTypes]
                    properties:
                        value: { $ref: '#/components/schemas/ReportType' }
                        label: { type: string }
                        scope: { $ref: '#/components/schemas/ReportScope' }
                        poiKind: { nullable: true, allOf: [{ $ref: '#/components/schemas/PoiKind' }], description: 'For point types: which object picker to show' }
                        fuelTypes:
                            type: array
                            description: 'Non-empty only for fuel_shortage: the fuel-type choices to show'
                            items:
                                type: object
                                required: [value, label]
                                properties:
                                    value: { $ref: '#/components/schemas/FuelType' }
                                    label: { type: string }
                ReportAccepted:
                    type: object
                    required: [reportId, h3Cell, createdAt, scope, poi, fuelTypes]
                    properties:
                        reportId: { type: string, format: uuid }
                        h3Cell: { type: string }
                        createdAt: { type: string, format: date-time }
                        scope: { $ref: '#/components/schemas/ReportScope' }
                        poi: { nullable: true, allOf: [{ $ref: '#/components/schemas/PoiRef' }], description: 'The station / shelter the report was bound to (point types)' }
                        fuelTypes: { type: array, items: { $ref: '#/components/schemas/FuelType' } }
                PhotoAccepted:
                    type: object
                    description: Returned right after a photo upload; analysis runs in the background and is visible to operators only.
                    required: [photoId, reportId, status, width, height, bytes, createdAt]
                    properties:
                        photoId: { type: string, format: uuid }
                        reportId: { type: string, format: uuid }
                        status: { type: string, enum: [processing] }
                        width: { type: integer, description: 'After server-side resize (longest edge <= 1600 px)' }
                        height: { type: integer }
                        bytes: { type: integer, description: 'Size of the stored JPEG' }
                        createdAt: { type: string, format: date-time }
                ReportIncidentRef:
                    type: object
                    required: [id, type, typeLabel, status, statusLabel, confidenceLevel, confidenceLabel, confidenceScore]
                    properties:
                        id: { type: string, format: uuid }
                        type: { $ref: '#/components/schemas/ReportType' }
                        typeLabel: { type: string }
                        status: { $ref: '#/components/schemas/IncidentStatus' }
                        statusLabel: { type: string }
                        confidenceLevel: { $ref: '#/components/schemas/ConfidenceLevel' }
                        confidenceLabel: { type: string }
                        confidenceScore: { type: number, format: float, minimum: 0, maximum: 1 }
                ReportStatusView:
                    type: object
                    required: [reportId, type, typeLabel, createdAt, incident]
                    properties:
                        reportId: { type: string, format: uuid }
                        type: { $ref: '#/components/schemas/ReportType' }
                        typeLabel: { type: string }
                        createdAt: { type: string, format: date-time }
                        incident:
                            nullable: true
                            allOf: [{ $ref: '#/components/schemas/ReportIncidentRef' }]
                            description: null until clustering (asynchronous, usually within seconds) attached the report to an incident

                # ---- verification -------------------------------------------------------------
                VerificationQuestion:
                    type: object
                    required: [verificationId, incidentId, type, typeLabel, question, context, poi, options, sentAt, expiresAt, answered]
                    properties:
                        verificationId: { type: string, format: uuid }
                        incidentId: { type: string, format: uuid }
                        type: { $ref: '#/components/schemas/ReportType' }
                        typeLabel: { type: string }
                        question: { type: string }
                        context: { type: string }
                        poi:
                            nullable: true
                            description: 'Point verification: the station / shelter the question is about (show its name; it may be a neighbour of the reported one)'
                            type: object
                            required: [kind, id, name]
                            properties:
                                kind: { $ref: '#/components/schemas/PoiKind' }
                                id: { type: string, format: uuid }
                                name: { type: string }
                        options:
                            type: array
                            items: { $ref: '#/components/schemas/VerificationAnswer' }
                        sentAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        answered: { type: boolean }
                VerificationResult:
                    type: object
                    required: [verificationId, incidentId, thanks]
                    properties:
                        verificationId: { type: string, format: uuid }
                        incidentId: { type: string, format: uuid }
                        thanks: { type: string, description: 'Polish thank-you line to show the user' }

                # ---- health -------------------------------------------------------------------
                Procedure:
                    type: object
                    description: Offline-safe safety checklist (Polish).
                    required: [id, title, summary, steps, appliesTo, priority]
                    properties:
                        id: { type: string, example: power-outage }
                        title: { type: string }
                        summary: { type: string }
                        steps: { type: array, items: { type: string } }
                        appliesTo: { type: array, items: { $ref: '#/components/schemas/ReportType' }, description: 'Empty = general procedure' }
                        priority: { type: integer, description: 'Higher first' }
                OfflineBundle:
                    type: object
                    description: Snapshot to cache for degraded / offline mode around one position.
                    required: [generatedAt, validUntil, center, radiusMeters, shelters, alerts, incidents, procedures]
                    properties:
                        generatedAt: { type: string, format: date-time }
                        validUntil: { type: string, format: date-time, description: 'Refresh after this time (24 h) or on foreground' }
                        center: { $ref: '#/components/schemas/GeoJsonGeometry' }
                        radiusMeters: { type: integer }
                        shelters: { type: array, items: { $ref: '#/components/schemas/ShelterView' }, description: 'Nearest first, with distanceMeters' }
                        alerts: { type: array, items: { $ref: '#/components/schemas/AlertView' } }
                        incidents: { type: array, items: { $ref: '#/components/schemas/IncidentView' } }
                        procedures: { type: array, items: { $ref: '#/components/schemas/Procedure' } }
                HealthStatus:
                    type: object
                    required: [status, time]
                    properties:
                        status: { type: string, enum: [ok, degraded] }
                        postgis: { type: string, nullable: true }
                        h3: { type: string, nullable: true }
                        h3Postgis: { type: string, nullable: true }
                        time: { type: string, format: date-time }
        security:
            - Bearer: []
        tags:
            - { name: Devices, description: 'Anonymous device identity and location' }
            - { name: Reports, description: 'Citizen reports (DETECT)' }
            - { name: Incidents, description: 'Public incident view and map' }
            - { name: Verification, description: 'Active crowd verification prompts (VERIFY / MAP)' }
            - { name: Alerts, description: 'Area alerts for citizens (INFORM)' }
            - { name: Shelters, description: 'Shelter map and status confirmations' }
            - { name: Command, description: 'Operator endpoints' }
    areas:
        path_patterns:
            - ^/api(?!/doc$)
